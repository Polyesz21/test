name: Build Windows EXE (32-bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x86'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build the portable EXE
      run: pyinstaller --onefile --console ping_monitor.py

    - name: Upload EXE for download
      uses: actions/upload-artifact@v4
      with:
        name: PingMonitor-Windows-32bit-EXE
        path: dist/ping_monitor.exe
