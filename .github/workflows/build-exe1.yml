name: Build WinXP EXE (C/MinGW)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Compile C code for 32-bit Windows
      run: i686-w64-mingw32-gcc ping_monitor.c -o ping_monitor.exe -static

    - name: Upload EXE for download
      uses: actions/upload-artifact@v4
      with:
        name: PingMonitor-WinXP-EXE
        path: ping_monitor.exe
